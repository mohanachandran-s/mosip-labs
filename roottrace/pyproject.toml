[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roottrace"
version = "0.1.0"
description = "RootTrace — root-cause finder for Kubernetes/Rancher environments using Loki logs and dependency analysis"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pyyaml>=6", "jinja2>=3.1", "drain3>=0.9.11", "kubernetes>=29"]

[project.scripts]
roottrace = "roottrace.cli:main"

[tool.setuptools]
packages = ["roottrace"]

[tool.setuptools.package-data]
roottrace = ["known_issues.yaml", "dependencies.yaml"]
