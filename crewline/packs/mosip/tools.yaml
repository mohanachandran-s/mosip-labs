# MOSIP overlay, merged on top of core/tools.yaml when the active pack is mosip.
version: 2
capabilities:
  java21:
    needed_for: [DETERMINISTIC_VALIDATION, SYSTEM_TEST_EXECUTION, QUALITY_GATE]
    check: {command: "java -version", expect: "21"}
    enable:
      - 'Install a JDK 21 (e.g. Eclipse Temurin 21) and add its `bin` folder to PATH.'
      - 'Open a new terminal and run `java -version`; it must report version 21.'

  maven:
    needed_for: [DETERMINISTIC_VALIDATION, SYSTEM_TEST_EXECUTION, QUALITY_GATE]
    check: {command: "mvn -v"}
    enable:
      - 'Install Apache Maven 3.9+ from https://maven.apache.org/download.cgi and add `bin` to PATH.'
      - 'Run `mvn -v`. For offline builds, run one online build first so `~/.m2` has the dependencies (apitest-commons).'

  test_credentials:
    needed_for: [SYSTEM_TEST_EXECUTION, QUALITY_GATE]
    check: {adapter: "credential fields of <module>.properties are SET (values never read into context)"}
    enable:
      - 'Put the environment''s credential file somewhere local (e.g. `Kernel_files/<env>.txt`), never in a repo.'
      - 'Tell the assistant its path; it merges values into the worktree config, marks it skip-worktree, and restores it after the run.'

  jira_connector:
    needed_for: [INPUT_VALIDATION (tracker.system jira), create_application_bug, bug comments, tracker closure comment]   # overrides the core entry with the MOSIP site
    check: {adapter: "Atlassian tools present; getAccessibleAtlassianResources lists mosip.atlassian.net with write:jira-work"}
    enable:
      - 'In the Claude desktop app, open Settings → Connectors.'
      - 'Find Atlassian (Jira/Confluence) and choose Connect; sign in to mosip.atlassian.net and approve the permissions.'
      - 'Back in the session, ask the assistant to re-check; it will list the accessible sites.'

  browser_upload:
    needed_for: [attach run report to a bug (the Jira connector cannot upload files)]
    check: {adapter: "mcp__claude-in-chrome__list_connected_browsers returns at least one browser"}
    enable:
      - 'Install Claude in Chrome from https://chromewebstore.google.com/detail/fcoeoabgfenejglbffodgkkbkcdhcgfn (use the Chrome profile you use for Jira).'
      - 'Click the extension icon to open the Claude side panel and sign in with the same account as this desktop app.'
      - 'In the same Chrome profile, sign in to https://mosip.atlassian.net.'
      - 'Keep Chrome open and tell the assistant to retry; it checks for the connected browser before uploading.'

  coverage_cli:
    needed_for: [DETERMINISTIC_VALIDATION on modules with coverage/]
    check: {adapter: "mosip-functional-tests/apitest-commons exists and `mvn -q -o compile` succeeds there (crewline coverage reports NOT_RUN otherwise)"}
    enable:
      - 'Clone mosip-functional-tests next to the module repos.'
      - 'Run one online `mvn -q compile -Dgpg.skip=true -Dmaven.gitcommitid.skip=true` in `apitest-commons`.'

  module_build:
    needed_for: [feature, bug-fix, refactor, dependency-upgrade, database-migration]
    check: {command: "mvn -v"}
    enable:
      - 'Same as maven + java21 above. Then run one online `mvn -B -q -DskipTests install` in the service parent (e.g. `pre-registration/pre-registration`) so `~/.m2` has kernel libraries.'
      - 'If the build fails in a git worktree on git-commit-id-plugin, add `-Dmaven.gitcommitid.skip=true` (KI-PR-010).'

  branch_test_env:
    needed_for: [SYSTEM_TEST_EXECUTION of feature, bug-fix, refactor, dependency-upgrade, database-migration]
    check: {adapter: "test_plan.environment set and reachable (health endpoint), and the TestRig report header shows the branch commit"}
    enable:
      - 'Preferred: a dev/qa environment where CI deploys the PR image (ask the platform team which namespace and how to trigger it).'
      - 'Else a local stack: the module docker-compose or a local service run (e.g. inji-verify docker-compose/), TestRig env.endpoint pointed at it.'
      - 'Else defer: record an exception for gate system_tests naming the environment and date of the post-merge run; the run becomes a follow-up task and its results close the traceability (TRC-009).'
