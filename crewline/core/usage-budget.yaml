# Token budgets (Blueprint cost control). Metric is TOTAL tokens the API billed:
# input + cache_write + cache_read + output. cache_read is cheap per token but is usually
# the largest number and still counts on Cursor/Claude packs.
#
# PILOT-001 (Verified): ~3M total per review round; ~6.7M waiting on background runs.
# Defaults are a stop, not a target. Raise only with an attributed gate exception on token_budget.
version: 1
metric: total
per_task: 8000000          # whole task; exceed -> WAITING_FOR_USER (continue / split / abort)
per_state: 2500000         # default cap for any one workflow state
warn_ratio: 0.7
hot_states:
  IMPLEMENTATION: 3000000
  IMPLEMENTATION_REVIEW: 2500000
  FRESH_CONTEXT_REVIEW: 2500000
  SYSTEM_TEST_EXECUTION: 1500000
  PR_CLOSEOUT: 1500000
per_subagent: 1500000      # one subagent run (USE-011). KM-COV-001: 8 testcase-designers at 2.3M-11.7M each
context_warn: 150000       # peak context of one call, orchestrator or subagent (USE-012): compact / split
packet_max_chars: 20000   # specialist context packet on disk (tasks/<id>/packets)
clip_max_chars: 4000       # crewline clip / run digest (the agent reads this, never the raw log)
read_max_bytes: 131072     # GRD-008: Read of a file larger than this is denied (Grep / clip instead)
