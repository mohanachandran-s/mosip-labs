# Quality gates (Blueprint v2.1 §8). Each gate's status is recorded in the task manifest as
# PASS | FAIL | BLOCKED | NOT_RUN | NOT_APPLICABLE with rationale + evidence_refs + checked_at_commit.
# `enforced_by: deterministic` means a command decides; an agent may not set the status by opinion.
# `state` is where the gate is produced. A gate whose state is not on the task type's path is not applicable
# (crewline manifest skips guards on it). Which gates a task type REQUIRES is in core/workflows/<type>.yaml.
# MOSIP TestRig / CoverageCli commands (`testcase`, `expected-diff`, `coverage`, `scope`) apply when the active
# pack has sdet.testrig / coverage_cli (default: mosip). Generic pack: those CLIs return NOT_RUN; fill the same
# gates with the module's own suite via `crewline run` / `regression` / `trace`.
# Code task types leave REQUIREMENT_ANALYSIS, ACCEPTANCE_REVIEW, IMPACT_ANALYSIS, TESTCASE_DESIGN and TESTCASE_REVIEW only
# with the specialist's packets/<STATE>.md (`agent:` a Crewline agent, not the orchestrator; `context_id:`) (PKT-001/004).
# Evidence checks (SYS-*, REG-007/008, PKT-004) refuse missing or malformed records; a hand-typed record that has every
# field is still honour-system and is for review to catch.
version: 2

gates:
  # --- module onboarding (Phase 0) ---------------------------------------------------------------------
  onboarding_discovery:
    state: IMPACT_ANALYSIS
    enforced_by: deterministic
    commands: ["discover --repo <module repo> --module <name>"]
    requires: [discovery.json + drafts written, every guidance file reported (DSC-006) read, DSC-001/002 coverage warnings carried into the drafts]

  onboarding_baseline:
    state: KNOWLEDGE_UPDATE
    enforced_by: deterministic+review
    commands: ["testcase --scope all with the reviewed profile", "tools", "migration conventions recorded"]
    requires: [reviewed profile in <module repo>/.crewline/qa/profile.yaml, baseline findings recorded as existing debt, Inferred rows confirmed or left Inferred with a reason, approval onboarding_review]

  # --- requirements and design ------------------------------------------------------------------------
  input_readiness:
    state: INPUT_VALIDATION
    enforced_by: agent+human
    requires: [tracker ticket confirmed / created on approval / waived (tracker_guard, MAN-017), design document or approved exception, OpenAPI where an API contract exists]
    on_fail: WAITING_FOR_USER

  acceptance_readiness:
    state: ACCEPTANCE_REVIEW
    enforced_by: review
    agent: acceptance-reviewer
    requires: [every AC testable (observable outcome, no "should work"), contradictions resolved, NFRs stated where relevant]

  requirement_clarity:
    state: ACCEPTANCE_REVIEW
    enforced_by: deterministic
    commands: ["requirement-clarity --manifest <task-manifest.json>"]
    requires: [story/bug key recorded, numbered ACs with an observable outcome, open_ambiguities == 0, no TBD/should-work/as-expected phrasing]
    on_fail: WAITING_FOR_USER
    note: >-
      Closes the hole where open_ambiguities is set to 0 without testable ACs, and where bug-fix skipped a human
      acceptance review. The model must not invent the missing business rule.

  design_readiness:
    state: DESIGN
    enforced_by: review+human
    agent: solution-architect
    requires: [options considered, recommendation with trade-offs, API/DB/compatibility impact, rollback approach, ADR for a material decision, approval design recorded, packets/DESIGN.md on disk before leaving DESIGN]
    note: >-
      The stamp is not enough. `manifest --to` from DESIGN fails PKT-001 without packets/DESIGN.md.

  testcase_readiness:
    state: TESTCASE_REVIEW
    enforced_by: deterministic+review
    commands: [coverage]                 # CoverageCli check where the module has a matrix
    requires: [every AC maps to >=1 test (matrix row / unit test / TestRig case), tests derived from ACs and design, not from the implementation]
    on_fail: TESTCASE_DESIGN

  reproduction:
    state: TESTCASE_REVIEW
    enforced_by: deterministic
    commands: ["crewline run --repo <base worktree> --out <task>/evidence/reproduction.json -- <failing test>"]
    requires: [a test that FAILS on the base commit with the reported symptom; evidence/reproduction.json with exit_code != 0]
    note: >-
      bug-fix only. The gate stamp is not enough (REP-001/002). The same test must PASS on the branch
      (regression REG-006 for that id).

  plan_readiness:
    state: IMPLEMENTATION_PLAN
    enforced_by: review
    requires: [files/modules to change listed as scope.approved_paths, existing patterns and commons reuse cited, test plan per AC, $ID chain for TestRig cases]
    note: >-
      IMPLEMENTATION is refused when scope.approved_paths is empty. The plan stamp is not a file list.

  repo_ready:
    state: REPO_READY
    enforced_by: deterministic
    requires: [approval base_branch, upstream fetched, task branch/worktree created FROM that upstream ref, base_commit recorded, no foreign uncommitted changes touched]

  # --- build and deterministic checks ----------------------------------------------------------------
  build:
    state: DETERMINISTIC_VALIDATION
    enforced_by: deterministic
    commands: ["evidence --record <build.json> --repo <dir>"]   # e.g. mvn -B -DskipTests=false verify; exit 0 on HEAD
    requires: [compile + module lint/format plugins the repository already uses; no new warnings policy unless the repo has one]

  deterministic_validation:
    state: DETERMINISTIC_VALIDATION
    enforced_by: deterministic
    commands:                             # all must PASS; any NOT_RUN keeps the gate NOT_RUN
      - testcase --base <base_ref>                      # TestRig cases (SDET)
      - expected-diff --base <base_ref> --approvals <task>/approvals.yaml
      - coverage
      - secrets <changed files>
    on_fail: IMPLEMENTATION

  test_integrity:
    state: DETERMINISTIC_VALIDATION
    enforced_by: deterministic
    commands: ["test-integrity --repo <dir> --base <base_ref> [--approvals <yaml>] [--strict]", "expected-diff (TestRig)"]
    requires: [no removed/disabled unit tests, no removed assertions, no weakened TestRig expectations without an attributed approval]

  migration_pairing:
    state: DETERMINISTIC_VALIDATION
    enforced_by: deterministic
    commands: ["migration --repo <dir> --base <base_ref>"]
    requires: [every new upgrade/release script has its rollback/revoke twin, no edits to already-released scripts]

  dependency_security:
    state: DETERMINISTIC_VALIDATION
    enforced_by: deterministic
    commands: ["crewline run --repo <dir> --out <task>/evidence/dependency-security.json -- <module-named scanner>"]
    requires: [evidence/dependency-security.json with exit 0, or an attributed exception; no new HIGH/CRITICAL finding]
    note: >-
      Feature and dependency-upgrade IMPLEMENTATION_REVIEW fails DEPSEC-001/002 without that record.
      Use the scanner the module names in `.crewline/development/`. Do not invent a parallel one.

  unit_tests:
    state: UNIT_INTEGRATION_TEST
    enforced_by: deterministic
    commands: ["evidence --record <unit.json> --repo <dir>", "regression --baseline <base surefire dir> --candidate <branch surefire dir>"]
    requires: [changed modules' unit + integration tests run on HEAD; no PASS->FAIL vs base]

  diff_coverage:
    state: UNIT_INTEGRATION_TEST
    enforced_by: deterministic
    commands: ["run tests with coverage via crewline run (JaCoCo agent + jacoco:report, pytest --cov --cov-report=xml, Jest/Vitest lcov)", "diff-coverage --repo <dir> --base <base_ref> --jacoco <report or dir> --threshold 80"]
    requires: ["at least 80% of changed executable production lines executed by tests", every changed source file present in a report, report newer than the change]
    note: the threshold is the default; a repository standard (.crewline/development/local-context.md) may raise it. Lowering it needs an attributed gate exception.

  component_tests:
    state: UNIT_INTEGRATION_TEST
    enforced_by: deterministic
    commands: ["trace <task-manifest.json> (TRC-007)"]
    requires: [when system_tests is NOT_APPLICABLE, every API-facing AC (api true) has a passing component test at the HTTP boundary (MockMvc / @WebMvcTest / @SpringBootTest) asserting the status code and error code the caller sees]
    note: this is the developer-level stand-in for system tests when no environment runs the branch build; it never replaces system tests when one exists.

  coding_standards:
    state: DETERMINISTIC_VALIDATION
    enforced_by: deterministic
    commands: ["coding-standards --repo <dir> --base <base_ref> --manifest <task-manifest.json> [--evidence <record>]"]
    requires: [every checker the module already has (spotless/checkstyle/eslint/prettier) has a fresh crewline run record at exit 0; production diff has no debug leftovers]
    note: >-
      Does not invent a style guide. Commands come from the repo (pom plugins, npm scripts) and .crewline/development.
      IMPLEMENTATION_REVIEW is refused until this PASSes so reviewers do not spend rounds on format.

  robustness:
    state: DETERMINISTIC_VALIDATION
    enforced_by: deterministic
    commands: ["robustness --repo <dir> --base <base_ref> --manifest <task-manifest.json>"]
    requires: [no empty/swallowed catch in the production diff, no raw throws Exception, no sleep on the hot path, implementation.robustness recorded, every api AC has a passing error-path test]
    note: >-
      Reuse the module's exception handler and error constants (commons-first). Do not invent a parallel hierarchy.
      IMPLEMENTATION_REVIEW is refused until this PASSes so reviewers do not spend rounds on try/catch and N+1.

  requirement_fit:
    state: DETERMINISTIC_VALIDATION
    enforced_by: deterministic
    commands: ["requirement-fit --repo <dir> --base <base_ref> --manifest <task-manifest.json>"]
    requires: [every AC observable (status, MOSIP-* error, route, quoted value) appears in the diff or code_ref files, code_refs were actually touched, those observables also appear in a changed test file (RFT-005)]
    note: >-
      Traceability checks links. This checks content. A production string is not proof a test asserts the story.
      IMPLEMENTATION_REVIEW is refused until it PASSes so reviewers do not spend rounds on "that is not what the
      story said". Never waivable.

  # --- reviews ---------------------------------------------------------------------------------------
  implementation_review:
    state: IMPLEMENTATION_REVIEW
    enforced_by: review
    agent: code-reviewer
    independence: [reviewer is not an author (MAN-011)]

  fresh_context_review:
    state: FRESH_CONTEXT_REVIEW
    enforced_by: review
    agent: fresh-context-reviewer
    independence: [new context, source-only packet, no implementer reasoning, different context id from review 1]

  # --- system tests, regression, quality gate --------------------------------------------------------
  branch_environment:
    state: SYSTEM_TEST_EXECUTION
    enforced_by: deterministic
    commands: ["branch-env --manifest <task-manifest.json>"]
    requires: [test_plan.environment_kind is branch-deployed-env or local-stack (or post-merge-deferred with an attributed exception), test_plan.environment names where the BRANCH build runs]
    on_fail: WAITING_FOR_USER
    note: >-
      Does not provision Q8. It refuses a missing kind (BEV-001), a deferral without an exception (BEV-002),
      an empty URL (BEV-003), and a released-only host named as the branch (BEV-004). Laptop recipe:
      evals/q8-local-stack.md. The user names the env.

  system_tests:
    state: SYSTEM_TEST_EXECUTION
    enforced_by: deterministic
    commands: ["crewline run --repo <module>/<suite> --out <task>/evidence/system-tests[-<suite>].json -- <branch-build suite>"]
    requires: ["evidence/system-tests.json with command and exit_code (SYS-001)", "a record runs a system suite the module declares in .crewline/module.yaml - stack.api_test, ui_test_projects, system_test_projects (SYS-002)", "a change to stack.node_projects has a UI rig run (SYS-003)", "environment is the branch build, not released"]
    note: >-
      SDET runs the new cases AND the module's existing TestRig regression (API/UI/DSL) on an environment running the BRANCH
      build, chosen in the test plan (test_plan.environment_kind): branch-deployed-env (CI image on a dev/qa env) |
      local-stack (module docker-compose or local service run, TestRig pointed at it) | post-merge-deferred (only with an
      attributed system_tests exception naming the environment and date; results then recorded DEFERRED and the run becomes
      a follow-up task). Never NOT_APPLICABLE for code templates (no_silent_na, MAN-015).

  full_regression:
    state: QUALITY_GATE
    enforced_by: deterministic
    note: targeted runs are fine while iterating; this full run is required once before commit
    procedure: [unit/component suites base vs branch AND the TestRig system suites base vs branch (same env, sequential)]
    commands: ["regression --baseline <base report> --candidate <branch report> --out <task>/evidence/full-regression[-<suite>].json --allow-fail <id with attributed exception>"]
    requires: ["code task types - a PASS full-regression record before COMMIT_PR (REG-007)", "one record compares a system suite the module declares (REG-008)", "reports - TestRig full-report HTML, JUnit/Surefire XML, Cucumber JSON (UI rig)"]
    blocks_on: [PASS->FAIL on branch, new test failing without exception]
    scope_rule: "crewline scope (TestRig) / changed modules (unit): only new tests added -> those tests (+ producers); anything else -> FULL"

  defect_reports:
    state: QUALITY_GATE
    enforced_by: deterministic
    commands: ["defect-reports --manifest <task-manifest.json>"]
    requires: [APPLICATION/SECURITY defects have a report_path, that file exists, secrets scan of it PASSes (values never printed)]
    note: PILOT-001 attached an actuator dump. Procedure is not enough.

  defect_closure:
    state: QUALITY_GATE
    enforced_by: deterministic
    commands: ["manifest --to COMMIT_PR (MAN-014)"]
    requires: [every defect found in the task recorded in manifest.defects, CODE_UNDER_CHANGE defects fixed (developer loop) and their tests passing, pre-existing APPLICATION/SECURITY defects raised as bugs with the run report or deferred with a reason]

  traceability:
    state: QUALITY_GATE
    enforced_by: deterministic
    commands: ["trace <task-manifest.json>"]
    requires: [every AC -> >=1 test id with a recorded result; for code tasks every AC -> >=1 code_ref; every code_ref inside approved_paths; every user-facing AC (api/ui) -> >=1 automated system test built or reused by SDET (TRC-008/009)]

  change_scope:
    state: QUALITY_GATE
    enforced_by: deterministic
    commands: ["change-scope --repo <dir> --base <base_ref> --manifest <task-manifest.json>"]
    requires: [every changed file inside scope.approved_paths, or an approval scope_change naming it]

  secrets:
    state: QUALITY_GATE
    enforced_by: deterministic
    commands: [secrets <changed files>]

  token_budget:
    state: QUALITY_GATE
    enforced_by: deterministic
    commands: ["usage --manifest <task-manifest.json> --transcript <session.jsonl>"]
    requires: [task total and per-state totals under core/usage-budget.yaml, specialist packets under packet_max_chars,
      packets/IMPLEMENTATION.md before IMPLEMENTATION_REVIEW, packets/FRESH_CONTEXT_REVIEW.md before review 2 (PKT-001)]
    on_fail: WAITING_FOR_USER
    note: >-
      Accounting is not protection. Exceeding the budget stops the task. Cursor often has no transcript: the adapter
      token fire-break is then the control (USE-006). Raise the cap only with an attributed exception.

  quality_gate:
    state: QUALITY_GATE
    enforced_by: deterministic
    requires: [every required_gates entry of the task template PASS / NOT_APPLICABLE, or an attributed exception (MAN-012)]

  # --- git / PR --------------------------------------------------------------------------------------
  dco:
    state: COMMIT_PR
    enforced_by: deterministic
    commands: [dco --range <base_ref>..HEAD]

  branch_scope:
    state: COMMIT_PR
    enforced_by: deterministic
    commands: [branch --upstream <upstream_remote>/<base_branch> --base <base_commit> --story <KEY> --upstream-repo <owner/repo> --pr-repo <owner/repo> --pr-base <branch>]

  pr_ci:
    state: PR_CLOSEOUT
    enforced_by: deterministic
    commands: ["gh pr checks <n> --repo <upstream_repo> (read on each monitor event)"]
    requires: [monitoring on (pr.monitoring), every required check PASS on the PR head SHA, a failing check triaged in FAILURE_TRIAGE (CODE_UNDER_CHANGE -> dev loop, ENVIRONMENT -> re-run, else escalate)]

  ci_coverage:
    state: PR_CLOSEOUT
    enforced_by: deterministic
    commands: ["ci-coverage --manifest <task-manifest.json>"]
    requires: [every unit or component suite the task ran is in a CI workflow (CIC-001), or an attributed exception with its follow-up (MAN-019); checked on the move to FINAL_REPORT]

  pr_comments:
    state: PR_CLOSEOUT
    enforced_by: review
    requires: [every comment verified against the code that runs; valid -> fixed + retested + pushed + reply saying what changed; not valid -> reply with the reason; every review thread with such a reply resolved (no unresolved threads on the PR head); pr.valid_comments_open == 0]

  # --- release and operations ------------------------------------------------------------------------
  release_readiness:
    state: RELEASE_READINESS
    enforced_by: review+human
    agent: release-manager
    requires: [release notes, version compatibility (APIs, DB, config, dependent modules), rollback plan with tested steps, environment named by the user]

  post_deployment:
    state: POST_DEPLOYMENT_VALIDATION
    enforced_by: deterministic
    requires: [health endpoints UP, smoke suite (TestRig Smoke) PASS on the deployed version, report header matches the released commit]
    on_fail: incident task (read-only) + rollback proposal; never an automatic rollback

  knowledge_update:
    state: KNOWLEDGE_UPDATE
    enforced_by: review
    requires: [each entry labelled Verified/Inferred/Unknown with evidence; pending entries marked pending]

exceptions:
  required_fields: [gate, approver, reason, scope, timestamp]
  never_waivable: [secrets, requirement_clarity, requirement_fit, test_integrity without approval, repair caps, production deployment]
