task_type: database-migration
risk_tier: L3
summary: Schema/data impact -> migration and rollback design -> elevated approval -> paired upgrade/rollback scripts -> staged validation -> tests
path: [S0_BOOTSTRAP_CHECK, INTAKE, INPUT_VALIDATION, REQUIREMENT_ANALYSIS, ACCEPTANCE_REVIEW, IMPACT_ANALYSIS, DESIGN,
       TESTCASE_DESIGN, TESTCASE_REVIEW, IMPLEMENTATION_PLAN, GITHUB_PLANNING, REPO_READY, IMPLEMENTATION,
       DETERMINISTIC_VALIDATION, UNIT_INTEGRATION_TEST, IMPLEMENTATION_REVIEW, FRESH_CONTEXT_REVIEW,
       SYSTEM_TEST_EXECUTION, FAILURE_TRIAGE, QUALITY_GATE, COMMIT_PR, PR_CLOSEOUT, RELEASE_READINESS,
       KNOWLEDGE_UPDATE, FINAL_REPORT, DONE]
entry_guards:
  DESIGN:
    - {gate: requirement_clarity, eq: PASS}
    - {gate: acceptance_readiness, eq: PASS}
  TESTCASE_DESIGN:
    - {gate: design_readiness, eq: PASS}
  IMPLEMENTATION:
    - {path: test_plan.environment, ne: ""}   # where SDET runs system tests on the branch build
  IMPLEMENTATION_PLAN:
    - {approval: design}
    - {approval: migration_review}               # elevated: DB owner, even for additive changes
  IMPLEMENTATION_REVIEW:
    - {gate: coding_standards, eq: PASS}
    - {gate: robustness, eq: PASS}
    - {gate: requirement_fit, eq: PASS}
required_gates: [requirement_clarity, acceptance_readiness, design_readiness, testcase_readiness, migration_pairing, build, unit_tests, diff_coverage, component_tests, deterministic_validation, coding_standards, robustness, requirement_fit, test_integrity, system_tests, branch_environment, defect_reports, full_regression, secrets, change_scope, release_readiness, token_budget]
notes: Staged validation means apply upgrade, run tests, apply rollback, re-apply upgrade on a disposable DB. Never against a shared or production DB.
no_silent_na: [system_tests, full_regression]      # SDET always runs them; skipping needs an attributed exception (MAN-015)
